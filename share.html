<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>业务数据分享看板</title>
<style>
  :root{--primary:#4f46e5;--primary-soft:#eef2ff;--bg:#f5f6fa;--card:#fff;--text:#1f2430;--muted:#7b8294;--line:#e6e8ef;--radius:16px;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px 60px;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:4px 0 14px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .logo svg{width:22px;height:22px;}
  .brand h1{font-size:19px;margin:0;}
  .brand p{margin:0;font-size:12px;color:var(--muted);}
  .ro-flag{font-size:12px;font-weight:600;color:#1e3a8a;background:#dbeafe;border:1px solid #bfdbfe;border-radius:999px;padding:4px 12px;white-space:nowrap;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:6px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-decoration:none;color:var(--text);display:block;box-shadow:0 2px 10px rgba(31,36,48,.05);transition:border-color .12s ease,transform .12s ease;}
  .card:hover{border-color:var(--primary);transform:translateY(-1px);}
  .card .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .card .ic svg{width:20px;height:20px;}
  .card h3{margin:0 0 2px;font-size:15px;}
  .card p{margin:0;font-size:13px;color:var(--muted);}
  .note{margin-top:16px;background:#fffbeb;border:1px solid #fde9cf;border-radius:12px;padding:12px 14px;font-size:13px;color:#92400e;line-height:1.7;}
  .stats{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .stats .row{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--muted);}
  .stats b{color:var(--text);}
  .foot{margin-top:18px;font-size:12px;color:var(--muted);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div>
      <div><h1>业务数据分享看板</h1><p id="snapTime">加载中…</p></div>
    </div>
    <span class="ro-flag">只读分享副本</span>
  </header>

  <div class="cards">
    <a class="card" href="dashboard.html?share=1">
      <div class="ic" style="background:#eef2ff"><svg viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div>
      <h3>数据看板</h3><p>任务 · KPI 日报 · 月度汇总 · 供货方/产品/渠道全部分析</p>
    </a>
    <a class="card" href="project.html?share=1">
      <div class="ic" style="background:#e0f2fe"><svg viewBox="0 0 24 24" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-7L9 4H5a2 2 0 0 0-2 2z"/></svg></div>
      <h3>项目档案</h3><p>代理商/运营商/专业公司 46 条业务档案与对接信息</p>
    </a>
    <a class="card" href="product.html?share=1">
      <div class="ic" style="background:#fef3c7"><svg viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg></div>
      <h3>产品台账</h3><p>存量/宽带产品、缺品优先级、供货方关联</p>
    </a>
  </div>

  <div class="note">打开后页面与正式工作台一致、功能完整；数据为该快照时点的内容。快照数据只保存在<u>当前这台设备/浏览器</u>，修改不会回传、也不影响数据方。建议手机等新设备访问。</div>

  <div class="stats" id="statBox"><div class="row"><span>正在加载数据概况…</span></div></div>
  <div class="foot">由数据方导出分享快照生成 · 更新时间见上方</div>
</div>

<script>
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function jget(ls,k,fb){try{var v=JSON.parse(ls[k]||'null');return v==null?fb:v;}catch(e){return fb;}}
fetch("snapshot-v2.json?t="+Date.now()).then(r=>{if(!r.ok)throw new Error(String(r.status));return r.json();}).then(d=>{
  var ls=d.ls||{};
  var tEl=document.getElementById("snapTime");
  if(d.time){try{tEl.textContent="快照时间："+new Date(d.time).toLocaleString("zh-CN",{hour12:false});}catch(e){tEl.textContent="快照时间："+esc(d.time);}}
  var arch=jget(ls,"wb_project_archive",[]);
  var prod=jget(ls,"wb_product_data",{});
  var st=(prod.stock||[]).length,bb=(prod.broadband||prod.broad||[]).length;
  var tks=jget(ls,"wb_workdash_tasks",[]);
  var miss=jget(ls,"wb_miss_priority_v1",[]);
  var mts=jget(ls,"wb_workdash_metrics",[]);
  var cardTxt=document.querySelectorAll(".card h3");
  if(cardTxt[1])cardTxt[1].nextElementSibling.textContent="代理商/运营商/专业公司 "+arch.length+" 条业务档案与对接信息";
  if(cardTxt[2])cardTxt[2].nextElementSibling.textContent="存量 "+st+" / 宽带 "+bb+" 产品 · 缺品 "+miss.length+" 条";
  document.getElementById("statBox").innerHTML='<div class="row"><span>项目档案 <b>'+arch.length+'</b> 条</span><span>产品 <b>'+(st+bb)+'</b> 个（存量 '+st+' · 宽带 '+bb+'）</span><span>任务 <b>'+tks.length+'</b> 条</span><span>缺品优先级 <b>'+miss.length+'</b> 条</span><span>交易指标 <b>'+mts.length+'</b> 条</span></div>';
}).catch(e=>{
  document.getElementById("snapTime").textContent="加载失败";
  document.getElementById("statBox").innerHTML='<div class="row"><span>无法读取快照（'+esc(e.message)+'）。请确认页面与 snapshot-v2.json 在同一部署目录。</span></div>';
});
</script>
</body>
</html>
