<script>

  var target='dashboard.html';
  try{
    var saved=JSON.parse(localStorage.getItem('wb_shell_tab')||'null');
    if(saved && saved.name && TAB_BASE[saved.name]){
      target=TAB_BASE[saved.name] + (saved.qs?('?'+saved.qs):'');
    }
  }catch(e){}
  location.replace(target);
